<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClipCascade - Plugins</title>
    <link rel="stylesheet" href="/assets/style.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            color: #e0e0e0;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            padding: 32px;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .subtitle {
            margin-bottom: 24px;
            color: #999;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 24px;
        }

        .stat {
            padding: 14px;
            text-align: center;
        }

        .stat .value {
            font-size: 24px;
            font-weight: 700;
        }

        .stat .label {
            font-size: 11px;
            color: #999;
            margin-top: 4px;
        }

        .section {
            padding: 18px;
            margin-bottom: 24px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .section h3 {
            font-size: 14px;
            margin-bottom: 8px;
        }

        .hint {
            font-size: 13px;
            line-height: 1.55;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 9px 14px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 13px;
            cursor: pointer;
        }

        .badge {
            padding: 4px 8px;
            font-size: 12px;
            line-height: 1;
        }

        .empty {
            padding: 18px 12px;
            text-align: center;
            font-size: 13px;
        }

        input,
        select {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 13px;
        }

        @media (max-width: 780px) {
            .stats {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Automation Plugins</h1>
        <p class="subtitle">Loaded plugin packages for ClipCascade automation. Signed-in as <strong>{{.username}}</strong>.</p>

        <div class="stats">
            <div class="stat">
                <div class="value" id="plugin-total">-</div>
                <div class="label">Plugins</div>
            </div>
            <div class="stat">
                <div class="value" id="plugin-enabled">-</div>
                <div class="label">Enabled</div>
            </div>
            <div class="stat">
                <div class="value" id="plugin-invalid">-</div>
                <div class="label">Needs Attention</div>
            </div>
            <div class="stat">
                <div class="value" id="plugin-capabilities">-</div>
                <div class="label">Capabilities</div>
            </div>
        </div>

        <div class="section">
            <div class="section-header">
                <div>
                    <h3>Plugin Registry</h3>
                    <p class="hint" id="plugins-dir">Loading plugin directory...</p>
                </div>
                <button class="btn" onclick="loadPlugins()">Refresh</button>
            </div>
            <div class="plugin-toolbar">
                <input id="plugin-search" type="search" placeholder="Search plugins, capabilities, repository" oninput="renderPlugins()">
                <select id="plugin-status" onchange="renderPlugins()">
                    <option value="">All statuses</option>
                    <option value="loaded">Loaded</option>
                    <option value="disabled">Disabled</option>
                    <option value="invalid">Invalid</option>
                    <option value="missing_entry">Missing entry</option>
                </select>
            </div>
            <div id="plugin-list" class="plugin-list">
                <div class="empty">Loading plugins...</div>
            </div>
        </div>

        <div class="footer-links">
            ClipCascade
            <a href="/">Dashboard</a>
            <a href="/advance">Admin</a>
            <a href="/logout">Logout</a>
        </div>
    </div>

    <script>
        let pluginData = [];

        function escapeHTML(value) {
            return String(value || '').replace(/[&<>"']/g, ch => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[ch]));
        }

        function pluginStatus(status) {
            const safe = escapeHTML(status || 'invalid');
            return `<span class="badge ${safe}">${safe}</span>`;
        }

        function manifestID(manifest) {
            if (manifest.id) return manifest.id;
            if (manifest.publisher && manifest.name) return `${manifest.publisher}.${manifest.name}`;
            return manifest.name || '';
        }

        function manifestTitle(manifest) {
            return manifest.displayName || manifest.name || manifest.id || 'Unknown plugin';
        }

        function platformBlock(manifest) {
            return manifest.clipcascade || {};
        }

        async function setPluginEnabled(pluginID, enabled) {
            try {
                const res = await fetch(`/api/admin/automation/plugins/${encodeURIComponent(pluginID)}/enabled`, {
                    method: 'PUT',
                    credentials: 'same-origin',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ enabled })
                });
                const data = await res.json().catch(() => ({}));
                if (!res.ok) throw new Error(data.error || 'failed to update plugin');
                await loadPlugins();
            } catch (err) {
                alert(err.message || 'Failed to update plugin');
                await loadPlugins();
            }
        }

        function capabilityBadges(items) {
            if (!Array.isArray(items) || items.length === 0) return '<span class="badge">none</span>';
            return items.map(item => `<span class="badge">${escapeHTML(item)}</span>`).join('');
        }

        function optionalBadges(items) {
            if (!Array.isArray(items) || items.length === 0) return '';
            return items.map(item => `<span class="badge">${escapeHTML(item)}</span>`).join('');
        }

        function repositoryURL(repository) {
            if (!repository) return '';
            if (typeof repository === 'string') return repository;
            return repository.url || '';
        }

        function safeRepoURL(value) {
            try {
                const url = new URL(String(value || ''));
                return url.protocol === 'http:' || url.protocol === 'https:' ? url.toString() : '';
            } catch {
                return '';
            }
        }

        async function loadPlugins() {
            const list = document.getElementById('plugin-list');
            list.innerHTML = '<div class="empty">Loading plugins...</div>';
            try {
                const res = await fetch('/api/admin/automation/plugins', { credentials: 'same-origin' });
                if (!res.ok || res.redirected) {
                    throw new Error('failed to load plugin registry');
                }
                const data = await res.json();
                const stats = data.stats || {};
                pluginData = Array.isArray(data.plugins) ? data.plugins : [];
                document.getElementById('plugin-total').textContent = stats.total || 0;
                document.getElementById('plugin-enabled').textContent = stats.enabled || 0;
                document.getElementById('plugin-invalid').textContent = stats.invalid || 0;
                document.getElementById('plugin-capabilities').textContent = stats.capabilities || 0;
                document.getElementById('plugins-dir').textContent = `Directory: ${data.plugins_dir || '-'} · Automation ${data.enabled ? 'enabled' : 'disabled'}`;
                renderPlugins();
            } catch (err) {
                list.innerHTML = `<div class="empty">${escapeHTML(err.message || 'Failed to load plugins.')}</div>`;
            }
        }

        function renderPlugins() {
            const query = document.getElementById('plugin-search').value.trim().toLowerCase();
            const status = document.getElementById('plugin-status').value;
            const list = document.getElementById('plugin-list');
            const filtered = pluginData.filter(item => {
                const manifest = item.manifest || {};
                const platform = platformBlock(manifest);
                const repo = repositoryURL(manifest.repository);
                const haystack = [
                    manifestID(manifest),
                    manifest.name,
                    manifest.displayName,
                    manifest.publisher,
                    manifest.description,
                    manifest.version,
                    manifest.license,
                    repo,
                    item.readme_summary,
                    ...(platform.capabilities || []),
                    ...(manifest.categories || []),
                    ...(manifest.keywords || []),
                    ...(manifest.activationEvents || []),
                    ...(manifest.extensionKind || [])
                ].join(' ').toLowerCase();
                return (!query || haystack.includes(query)) && (!status || item.status === status);
            });
            if (filtered.length === 0) {
                list.innerHTML = '<div class="empty">No plugins match the current filter.</div>';
                return;
            }
            list.innerHTML = filtered.map(item => {
                const manifest = item.manifest || {};
                const platform = platformBlock(manifest);
                const repo = safeRepoURL(repositoryURL(manifest.repository));
                const pluginID = manifestID(manifest);
                const publisher = manifest.publisher ? ` · ${escapeHTML(manifest.publisher)}` : '';
                const engine = manifest.engines?.clipcascade ? ` · ClipCascade ${escapeHTML(manifest.engines.clipcascade)}` : '';
                const repoHTML = repo
                    ? `<a class="plugin-repo" href="${escapeHTML(repo)}" target="_blank" rel="noreferrer">Repository</a>`
                    : '<span class="muted">No repository</span>';
                const author = manifest.author?.name ? ` · ${escapeHTML(manifest.author.name)}` : '';
                const error = item.error ? `<p style="margin-top:8px;color:#ff9f9f">${escapeHTML(item.error)}</p>` : '';
                const checked = item.effective_enabled ? 'checked' : '';
                const disabled = pluginID ? '' : 'disabled';
                return `
                    <article class="plugin-item">
                        <div class="plugin-item-head">
                            <div>
                                <h3>${escapeHTML(manifestTitle(manifest))}</h3>
                                <p>${escapeHTML(manifest.description || 'No description')}</p>
                            </div>
                            <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end">
                                ${pluginStatus(item.status)}
                                <label class="plugin-switch">
                                    <input type="checkbox" ${checked} ${disabled} onchange="setPluginEnabled('${escapeHTML(pluginID)}', this.checked)">
                                    <span>Enabled</span>
                                </label>
                            </div>
                        </div>
                        <div class="plugin-meta">
                            <span class="badge">v${escapeHTML(manifest.version || '0.0.0')}</span>
                            <span class="badge">${escapeHTML(platform.entrypoint?.type || 'wasi')}</span>
                            ${capabilityBadges(platform.capabilities)}
                            ${optionalBadges(manifest.categories)}
                        </div>
                        <p class="muted">${escapeHTML(pluginID)}${publisher}${author}${engine} · ${repoHTML}</p>
                        ${manifest.activationEvents?.length ? `<p class="muted">Activation: ${escapeHTML(manifest.activationEvents.join(', '))}</p>` : ''}
                        <div class="plugin-readme">${escapeHTML(item.readme_summary || 'README summary unavailable.')}</div>
                        ${error}
                    </article>`;
            }).join('');
        }

        loadPlugins();
    </script>
</body>

</html>
