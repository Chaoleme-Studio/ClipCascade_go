name: ClipCascade CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_ref:
        description: "Optional Git ref to build (for example v2.4)"
        required: false
        default: ""

permissions:
  contents: write

env:
  GO_VERSION: "1.25"

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  # ──────────────── Test ────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev libxxf86vm-dev
      - name: Tidy modules
        run: |
          cd core && go mod tidy
          cd ../server && go mod tidy
          cd ../client-desktop && go mod tidy
          cd ../client-mobile && go mod tidy
          cd ../server-web-clip && go mod tidy
      - name: Run tests
        run: go test -v -race ./core/... ./server/... ./client-mobile/...
      - name: Vet
        run: go vet ./core/... ./server/... ./client-mobile/...

  # ──────────────── Build Server ────────────────
  build-server:
    name: Build Server (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          cd server
          EXT=""
          if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi
          go build -ldflags="-s -w" -o ../clipcascade-server-${{ matrix.goos }}-${{ matrix.goarch }}${EXT} .
      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.goos }}-${{ matrix.goarch }}
          path: clipcascade-server-*

  # ──────────────── Build Desktop ────────────────
  build-desktop:
    name: Build Desktop (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - os: macos-arm64
            runner: macos-14
            goos: darwin
            goarch: arm64
          - os: macos-amd64
            runner: macos-14
            goos: darwin
            goarch: amd64
          - os: windows-amd64
            runner: windows-latest
            goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
          CGO_CFLAGS: ${{ matrix.goos == 'darwin' && matrix.goarch == 'amd64' && '-arch x86_64' || '' }}
          CGO_LDFLAGS: ${{ matrix.goos == 'darwin' && matrix.goarch == 'amd64' && '-arch x86_64' || '' }}
        run: |
          cd client-desktop
          EXT=""
          if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi
          go build -ldflags="-s -w" -o ../clipcascade-desktop-${{ matrix.goos }}-${{ matrix.goarch }}${EXT} .
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: clipcascade-desktop-*

  # ──────────────── Build Desktop (Linux, legacy glibc) ────────────────
  # 统信 UOS V20 / deepin 20 基于 Debian 10（glibc 2.28）。
  # ubuntu-latest 是 glibc 2.39，编出来的产物硬绑 GLIBC_2.32 / GLIBC_2.34，
  # 在这些系统上直接 "version not found"。所以 linux-amd64 单独在 Debian 10
  # 容器里编译，产物只要求 2.28，同时兼容所有更新的发行版。
  build-desktop-linux-legacy:
    name: Build Desktop (linux-amd64 · glibc 2.28)
    needs: test
    runs-on: ubuntu-latest
    env:
      GO_TOOLCHAIN_VERSION: "1.25.0"
    steps:
      - uses: actions/checkout@v4

      - name: Build inside Debian 10 (buster)
        run: docker run --rm -v "$PWD:/src" -e VERSION="${GITHUB_REF_NAME#v}" -e GO_TOOLCHAIN_VERSION="${{ env.GO_TOOLCHAIN_VERSION }}" debian:buster bash /src/build-scripts/build_linux_legacy.sh desktop

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-amd64
          path: clipcascade-desktop-linux-amd64
          if-no-files-found: error

  # ──────────────── Docker ────────────────
  docker:
    name: Docker Image
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/') && env.DOCKERHUB_USERNAME != ''
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build (Local Only)
        if: env.DOCKERHUB_USERNAME == ''
        uses: docker/build-push-action@v5
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          tags: clipcascade:latest
      - name: Build & Push
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/build-push-action@v5
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/clipcascade:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/clipcascade:${{ github.ref_name }}

  # ──────────────── Build Desktop UI (Fyne) ────────────────
  build-desktop-ui-native:
    name: Build Desktop UI (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - os: macos-arm64
            runner: macos-14
            goos: darwin
            goarch: arm64
          - os: windows-amd64
            runner: ubuntu-latest
            goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install Fyne dependencies (Mac)
        if: matrix.goos == 'darwin'
        run: |
          go install fyne.io/tools/cmd/fyne@latest

      - name: Build Mac UI
        if: matrix.goos == 'darwin'
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
          CGO_CFLAGS: ${{ matrix.goos == 'darwin' && matrix.goarch == 'amd64' && '-arch x86_64' || '' }}
          CGO_LDFLAGS: ${{ matrix.goos == 'darwin' && matrix.goarch == 'amd64' && '-arch x86_64' || '' }}
        run: |
          mkdir -p build
          cd client-mobile
          export PATH="$(go env GOPATH)/bin:$PATH"
          go build -ldflags="-s -w" -o ../build/clipcascade-ui-desktop-${{ matrix.goos }}-${{ matrix.goarch }} .

      - name: Install fyne-cross (Windows docker)
        if: matrix.goos != 'darwin'
        run: |
          go install github.com/fyne-io/fyne-cross@latest

      - name: Build Windows cross UI
        if: matrix.goos != 'darwin'
        run: |
          mkdir -p build
          export PATH="$(go env GOPATH)/bin:$PATH"
          cd client-mobile
          GOWORK=off go mod vendor
          fyne-cross windows -arch=${{ matrix.goarch }} -app-id com.clipcascade.desktopui -env "GOFLAGS=-mod=vendor" -name fynemobile
          mv fyne-cross/bin/windows-${{ matrix.goarch }}/fynemobile.exe ../build/clipcascade-ui-desktop-windows-${{ matrix.goarch }}.exe

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-ui-${{ matrix.os }}
          path: build/clipcascade-ui-desktop-*

  # ──────────────── Build Desktop UI (Fyne, Linux legacy glibc) ────────────────
  # 与 build-desktop-linux-legacy 同理：Fyne 在 Linux 上同样依赖 CGO
  # （X11 + OpenGL），所以必须在老 glibc 环境里编译，否则统信 UOS V20 /
  # deepin 20 这类 glibc 2.28 系统跑不起来。
  build-desktop-ui-linux-legacy:
    name: Build Desktop UI (linux-amd64 · glibc 2.28)
    needs: test
    runs-on: ubuntu-latest
    env:
      GO_TOOLCHAIN_VERSION: "1.25.0"
    steps:
      - uses: actions/checkout@v4

      - name: Build inside Debian 10 (buster)
        run: docker run --rm -v "$PWD:/src" -e VERSION="${{ github.ref_name }}" -e GO_TOOLCHAIN_VERSION="${{ env.GO_TOOLCHAIN_VERSION }}" debian:buster bash /src/build-scripts/build_linux_legacy.sh mobile-ui

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-ui-linux-amd64
          path: build/clipcascade-ui-desktop-linux-amd64
          if-no-files-found: error

  # ──────────────── Build Mobile (Android Native Keepalive) ────────────────
  build-mobile-native:
    name: Build Mobile (Android Native Keepalive)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # 不用 android-actions/setup-android@v3：该 action 会执行 `sdkmanager tools`，
      # 而 Android 仓库里 legacy 的 `tools` 包已被移除，这一步必然报
      # "Failed to find package 'tools'" 后失败。runner 镜像本来就预装了 SDK
      # (/usr/local/lib/android/sdk)，直接定位它的 sdkmanager 即可。
      - name: Install Android components
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          test -d "$SDK" || { echo "::error::Android SDK not found at $SDK"; exit 1; }
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          SDKMGR="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1)"
          test -n "$SDKMGR" || { echo "::error::sdkmanager not found under $SDK"; exit 1; }
          echo "using sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"
      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          export PATH="$(go env GOPATH)/bin:$PATH"
          gomobile init
      - name: Build native Android APK
        env:
          CC_ANDROID_API: "26"
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          export ANDROID_HOME="${ANDROID_SDK_ROOT}"
          export ANDROID_NDK_HOME="${ANDROID_SDK_ROOT}/ndk/26.1.10909125"
          ./build-scripts/build.sh mobile-android-native
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-android-native
          path: build/ClipCascade-Android-Installable.apk
          if-no-files-found: error

  # ──────────────── Build Web Clip ────────────────
  build-web-clip:
    name: Build Web Clip (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          cd server-web-clip
          EXT=""
          if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi
          go build -ldflags="-s -w" -o ../clipcascade-web-${{ matrix.goos }}-${{ matrix.goarch }}${EXT} .
      - uses: actions/upload-artifact@v4
        with:
          name: web-clip-${{ matrix.goos }}-${{ matrix.goarch }}
          path: clipcascade-web-*

  # ──────────────── Release ────────────────
  release:
    name: Create Release
    needs: [build-server, build-desktop, build-desktop-linux-legacy, build-desktop-ui-native, build-desktop-ui-linux-legacy, build-mobile-native, build-web-clip]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: CHANGELOG-2.4.md
          files: artifacts/*
